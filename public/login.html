<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>访问验证 · 返工人工成本汇总表</title>
  <style>
    :root{
      color-scheme:light;
      --ink:#17181c;
      --text:#4c4f59;
      --muted:#9196a1;
      --line:#dfe2e8;
      --accent:#6673d8;
      --accent-soft:#eef0ff;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      color:var(--ink);
      background:#f1f2f5;
      font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .login{
      width:min(390px,100%);
      background:white;
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:30px;
      box-shadow:0 14px 40px rgba(15,23,42,.07);
    }
    .mark{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-bottom:18px;
      padding:4px 10px;
      border-radius:999px;
      background:var(--accent-soft);
      color:var(--accent);
      font-size:12px;
      font-weight:650;
    }
    .mark::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
    h1{margin:0 0 6px;font-size:23px;line-height:1.2;letter-spacing:-.4px}
    .desc{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.55}
    label{display:block;margin-bottom:7px;color:var(--text);font-size:12px;font-weight:600}
    input{
      width:100%;
      height:42px;
      border:1px solid var(--line);
      border-radius:8px;
      padding:0 12px;
      outline:none;
      font:inherit;
      color:var(--ink);
      background:white;
      transition:.12s ease;
    }
    input:focus{border-color:#aeb6ff;box-shadow:0 0 0 3px rgba(102,115,216,.10)}
    button{
      width:100%;
      height:42px;
      margin-top:12px;
      border:0;
      border-radius:8px;
      background:#23262d;
      color:white;
      font:600 14px/1 Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif;
      cursor:pointer;
    }
    button:disabled{opacity:.58;cursor:wait}
    .error{min-height:19px;margin-top:10px;color:#c23d45;font-size:12px}
    .config{
      display:none;
      margin:0 0 16px;
      padding:9px 10px;
      border-radius:8px;
      background:#fff6dc;
      color:#8b6400;
      font-size:12px;
      line-height:1.5;
    }
  </style>
</head>
<body>
  <main class="login">
    <div class="mark">CW Internal</div>
    <h1>返工人工成本汇总表</h1>
    <p class="desc">仅限授权人员访问。请输入共享访问密码。</p>
    <div class="config" id="configNotice">访问保护尚未完成环境变量配置。配置完成并重新部署后即可登录。</div>
    <form id="loginForm">
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" />
      <button id="submitButton" type="submit">登录</button>
      <div class="error" id="errorMessage" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const rawNext = params.get('next');
    const nextUrl = rawNext?.startsWith('/') && !rawNext.startsWith('//') ? rawNext : '/';
    if (params.get('config') === '1') document.getElementById('configNotice').style.display = 'block';

    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const submitButton = document.getElementById('submitButton');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.textContent = '';
      submitButton.disabled = true;
      submitButton.textContent = '验证中…';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value }),
        });

        if (response.ok) {
          window.location.replace(nextUrl);
          return;
        }

        const data = await response.json().catch(() => ({}));
        errorMessage.textContent = data.error || '登录失败，请稍后重试。';
        passwordInput.select();
      } catch {
        errorMessage.textContent = '无法连接到验证服务，请稍后重试。';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = '登录';
      }
    });
  </script>
</body>
</html>
